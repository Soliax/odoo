<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 223 260" width="223" height="260" role="img" aria-labelledby="badge-amethyst-title badge-amethyst-desc" data-level="AMETHYST">
  <title id="badge-amethyst-title">AMETHYST level portrait badge frame</title>
  <desc id="badge-amethyst-desc">Editable level-specific metallic badge frame with a top head-portrait slot and a lower custom-name plate. When inserting a real portrait or final name, update the SVG title and description to describe the finished badge.</desc>
