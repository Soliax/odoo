    <path id="badge-emerald-nameplateInner" d="M45 178 L178 178 L201 194 L186 220 L37 220 L22 194 Z"/>
    <path id="badge-emerald-crestOuter" d="M111.5 110 L154 126 L148 164 L111.5 179 L75 164 L69 126 Z"/>
    <path id="badge-emerald-crestInner" d="M111.5 118 L144 130 L139 157 L111.5 169 L84 157 L79 130 Z"/>
    <path id="badge-emerald-star" d="M111.5 124 L116 134 L127 135 L118.5 142.5 L121 154 L111.5 148 L102 154 L104.5 142.5 L96 135 L107 134 Z"/>
