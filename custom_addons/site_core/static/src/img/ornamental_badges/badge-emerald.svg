    <path id="badge-emerald-leafRight1" d="M216 119 L205 145 L195 141 Z"/>
    <path id="badge-emerald-leafRight2" d="M205 132 L192 157 L176 154 Z"/>
    <path id="badge-emerald-leafRight3" d="M190 140 L177 165 L156 160 Z"/>
    <path id="badge-emerald-leafRight4" d="M175 147 L162 170 L141 164 Z"/>
