  <g id="badge-emerald-glowGroup" filter="url(#badge-emerald-softGlow)">
    <use href="#badge-emerald-frameOuter" fill="url(#badge-emerald-photoGlow)"/>
    <use href="#badge-emerald-nameplateOuter" fill="url(#badge-emerald-photoGlow)"/>
