    <text id="badge-emerald-labelText" data-name-slot="true" x="111.5" y="197" text-anchor="middle" font-family="'Orbitron', 'Montserrat', 'Arial', sans-serif" font-size="14" font-weight="700" letter-spacing="1.1" fill="#f6fffb">CUSTOM NAME</text>
    <text id="badge-emerald-rankTitleShadow" data-rank-slot="true" x="111.5" y="212" text-anchor="middle" font-family="'Orbitron', 'Montserrat', 'Arial', sans-serif" font-size="8.2" font-weight="700" letter-spacing="1.8" fill="#000000" fill-opacity="0.74" transform="translate(0 1.2)">EMERALD TIER</text>
    <text id="badge-emerald-rankTitleText" data-rank-slot="true" x="111.5" y="212" text-anchor="middle" font-family="'Orbitron', 'Montserrat', 'Arial', sans-serif" font-size="8.2" font-weight="700" letter-spacing="1.8" fill="#f6fffb">EMERALD TIER</text>
