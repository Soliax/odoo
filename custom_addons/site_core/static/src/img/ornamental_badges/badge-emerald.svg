    <text id="badge-emerald-rankText" data-rank-code-slot="true" x="111.5" y="162" text-anchor="middle" font-family="'Orbitron', 'Montserrat', 'Arial', sans-serif" font-size="10" font-weight="800" letter-spacing="1.4" fill="#f6fffb">EMR</text>
