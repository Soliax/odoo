<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 223 260" width="223" height="260" role="img" aria-labelledby="badge-emerald-title badge-emerald-desc" data-level="EMERALD">
  <title id="badge-emerald-title">EMERALD profile ranking badge</title>
  <desc id="badge-emerald-desc">Editable RPG-style profile ranking badge with a replaceable real-person portrait slot, dynamic crest rank text, and a lower nameplate for editable name and rank title.</desc>
  <defs>
    <linearGradient id="badge-emerald-outerMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#a2ffb3"/>
      <stop offset="0.28" stop-color="#4dd36e"/>
      <stop offset="0.56" stop-color="#0d6b42"/>
      <stop offset="0.78" stop-color="#4dd36e"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badge-emerald-facetMetal" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.3" stop-color="#e6ffe0" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#0d6b42" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="badge-emerald-innerPanel" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#10201c"/>
      <stop offset="0.58" stop-color="#0a4b2b"/>
      <stop offset="1" stop-color="#030506"/>
    </radialGradient>
    <radialGradient id="badge-emerald-photoGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#13a05a" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#4dd36e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="badge-emerald-glassShine" cx="34%" cy="24%" r="84%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badge-emerald-softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="badge-emerald-photoClip"><path d="M111.5 21 L178 49 L170 113 L148 136 L128 136 L121 118 L102 118 L95 136 L75 136 L53 113 L45 49 Z"/></clipPath>
