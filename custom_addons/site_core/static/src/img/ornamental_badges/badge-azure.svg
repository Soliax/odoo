      <stop offset="0.45" stop-color="#2f90d0"/>
      <stop offset="1" stop-color="#0d3d76"/>
    </linearGradient>
    <linearGradient id="badge-azure-accentRibbonEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.32" stop-color="#b7eeff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d3d76"/>
    </linearGradient>
    <radialGradient id="badge-azure-photoBackdrop" cx="50%" cy="36%" r="70%">
