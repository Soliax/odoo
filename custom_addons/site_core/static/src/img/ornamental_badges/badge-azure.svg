      <stop offset="0.45" stop-color="#b7eeff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1676c0"/>
    </radialGradient>
    <radialGradient id="badge-azure-haloGlow" cx="50%" cy="48%" r="40%">
      <stop offset="0" stop-color="#63ccff" stop-opacity="0.65"/>
