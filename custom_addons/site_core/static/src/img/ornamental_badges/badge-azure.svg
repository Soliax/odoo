      <stop offset="0.08" stop-color="#a1fbff"/>
      <stop offset="0.28" stop-color="#3fc7d6"/>
      <stop offset="0.56" stop-color="#0d5e73"/>
      <stop offset="0.78" stop-color="#3fc7d6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
