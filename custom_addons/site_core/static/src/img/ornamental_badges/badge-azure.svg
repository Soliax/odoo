<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1400" width="1200" height="1400" role="img" aria-labelledby="badge-azure-title badge-azure-desc">
  <title id="badge-azure-title">AZURE ornamental portrait badge</title>
  <desc id="badge-azure-desc">Editable metallic badge with ornate frame, portrait clip region, stars, ribbon and replaceable label text.</desc>
  <defs>
