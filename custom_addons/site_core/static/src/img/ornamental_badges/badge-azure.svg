      <stop offset="1" stop-color="#98651b"/>
    </linearGradient>
    <linearGradient id="badge-azure-innerMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.18" stop-color="#d0ab57"/>
      <stop offset="0.5" stop-color="#7c5516"/>
      <stop offset="0.76" stop-color="#f1db9f"/>
      <stop offset="1" stop-color="#6c4310"/>
