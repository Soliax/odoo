      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badge-crimson-softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="badge-crimson-photoClip"><path d="M111.5 24 L183 49 L171 109 L149 131 L128 131 L121 116 L102 116 L95 131 L74 131 L52 109 L40 49 Z"/></clipPath>
