      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#ffaf88"/>
      <stop offset="0.28" stop-color="#ef6f42"/>
      <stop offset="0.56" stop-color="#8c290f"/>
      <stop offset="0.78" stop-color="#ef6f42"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badge-crimson-facetMetal" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.3" stop-color="#ffe8df" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#8c290f" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="badge-crimson-innerPanel" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#10201c"/>
