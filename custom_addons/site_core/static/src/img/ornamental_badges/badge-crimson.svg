      <stop offset="0.55" stop-color="#ef6f42" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="badge-crimson-glassShine" cx="34%" cy="24%" r="84%">
