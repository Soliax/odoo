<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 223 260" width="223" height="260" role="img" aria-labelledby="badge-ruby-title badge-ruby-desc" data-level="RUBY">
  <title id="badge-ruby-title">RUBY level portrait badge frame</title>
  <desc id="badge-ruby-desc">Editable level-specific metallic badge frame with a top head-portrait slot and a lower custom-name plate. When inserting a real portrait or final name, update the SVG title and description to describe the finished badge.</desc>
  <defs>
    <linearGradient id="badge-ruby-outerMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#ff99a7"/>
      <stop offset="0.28" stop-color="#e85a69"/>
      <stop offset="0.56" stop-color="#7d1733"/>
      <stop offset="0.78" stop-color="#e85a69"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badge-ruby-facetMetal" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.3" stop-color="#ffe9ec" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#7d1733" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="badge-ruby-innerPanel" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#10201c"/>
      <stop offset="0.58" stop-color="#581024"/>
      <stop offset="1" stop-color="#030506"/>
    </radialGradient>
    <radialGradient id="badge-ruby-photoGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#b92a4c" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#e85a69" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="badge-ruby-glassShine" cx="34%" cy="24%" r="84%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badge-ruby-softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="badge-ruby-photoClip"><path d="M111.5 21 L181 52 L169 108 L149 134 L128 134 L121 118 L102 118 L95 134 L74 134 L54 108 L42 52 Z"/></clipPath>
