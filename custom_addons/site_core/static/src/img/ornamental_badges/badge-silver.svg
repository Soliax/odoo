<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 223 260" width="223" height="260" role="img" aria-labelledby="badge-silver-title badge-silver-desc" data-level="SILVER">
  <title id="badge-silver-title">SILVER profile ranking badge</title>
  <desc id="badge-silver-desc">Editable RPG-style profile ranking badge with a replaceable real-person portrait slot, dynamic crest rank text, and a lower nameplate for editable name and rank title.</desc>
  <defs>
