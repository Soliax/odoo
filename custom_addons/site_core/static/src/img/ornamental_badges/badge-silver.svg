      <stop offset="0.28" stop-color="#b8c8d8"/>
      <stop offset="0.56" stop-color="#5a6a7d"/>
      <stop offset="0.78" stop-color="#b8c8d8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
