      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#ffc65c"/>
      <stop offset="0.28" stop-color="#ff9b28"/>
      <stop offset="0.56" stop-color="#8e3c05"/>
      <stop offset="0.78" stop-color="#ff9b28"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badge-hsa-facetMetal" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.3" stop-color="#ffe5a5" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#8e3c05" stop-opacity="0.18"/>
