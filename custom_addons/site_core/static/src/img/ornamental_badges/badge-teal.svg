<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 223 260" width="223" height="260" role="img" aria-labelledby="badge-teal-title badge-teal-desc" data-level="TEAL">
  <title id="badge-teal-title">TEAL profile ranking badge</title>
  <desc id="badge-teal-desc">Editable RPG-style profile ranking badge with a replaceable real-person portrait slot, dynamic crest rank text, and a lower nameplate for editable name and rank title.</desc>
