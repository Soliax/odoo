      <stop offset="0.28" stop-color="#27c490"/>
      <stop offset="0.56" stop-color="#0c6954"/>
      <stop offset="0.78" stop-color="#27c490"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
