<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 223 260" width="223" height="260" role="img" aria-labelledby="badge-nb-title badge-nb-desc">
  <title id="badge-nb-title">NB portrait badge frame</title>
  <desc id="badge-nb-desc">Editable angular metallic badge frame based on the supplied PNG reference, with a clipped portrait area, beveled nameplate, side laurels, and replaceable text.</desc>
  <defs>
    <linearGradient id="badge-nb-outerMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#7d858f"/>
      <stop offset="0.26" stop-color="#3b4047"/>
      <stop offset="0.52" stop-color="#090b0d"/>
      <stop offset="0.76" stop-color="#3b4047"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badge-nb-edgeMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#7d858f" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#3b4047" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#090b0d" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="badge-nb-facetMetal" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.3" stop-color="#d8dde2" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#090b0d" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="badge-nb-innerPanel" cx="50%" cy="36%" r="70%">
      <stop offset="0" stop-color="#0f1f1b"/>
      <stop offset="0.55" stop-color="#1b2026"/>
      <stop offset="1" stop-color="#030506"/>
    </radialGradient>
    <radialGradient id="badge-nb-photoGlow" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#3b4047" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="badge-nb-glassShine" cx="34%" cy="24%" r="82%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badge-nb-softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="badge-nb-photoClip">
      <path d="M111.5 21 L178 49 L170 113 L148 136 L128 136 L121 118 L102 118 L95 136 L75 136 L53 113 L45 49 Z"/>
    </clipPath>
    <path id="badge-nb-frameOuter" d="M111.5 4 L198 38 L186 124 L161 150 L134 150 L128 131 L95 131 L89 150 L62 150 L37 124 L25 38 Z"/>
    <path id="badge-nb-frameInner" d="M111.5 18 L182 47 L173 117 L153 139 L127 139 L121 121 L102 121 L96 139 L70 139 L50 117 L41 47 Z"/>
    <path id="badge-nb-nameplateOuter" d="M37 170 L186 170 L214 191 L194 228 L29 228 L9 191 Z"/>
    <path id="badge-nb-nameplateInner" d="M45 178 L178 178 L201 194 L186 220 L37 220 L22 194 Z"/>
    <path id="badge-nb-crestOuter" d="M111.5 110 L154 126 L148 164 L111.5 179 L75 164 L69 126 Z"/>
    <path id="badge-nb-crestInner" d="M111.5 118 L144 130 L139 157 L111.5 169 L84 157 L79 130 Z"/>
    <path id="badge-nb-star" d="M111.5 124 L116 134 L127 135 L118.5 142.5 L121 154 L111.5 148 L102 154 L104.5 142.5 L96 135 L107 134 Z"/>
    <path id="badge-nb-leafLeftA" d="M7 119 L28 141 L17 145 Z"/>
    <path id="badge-nb-leafLeftB" d="M18 132 L47 154 L31 157 Z"/>
    <path id="badge-nb-leafLeftC" d="M33 140 L67 160 L46 165 Z"/>
    <path id="badge-nb-leafLeftD" d="M48 147 L81 164 L60 170 Z"/>
    <path id="badge-nb-leafLeftE" d="M64 152 L94 166 L73 173 Z"/>
    <path id="badge-nb-leafRightA" d="M216 119 L205 145 L195 141 Z"/>
    <path id="badge-nb-leafRightB" d="M205 132 L192 157 L176 154 Z"/>
    <path id="badge-nb-leafRightC" d="M190 140 L177 165 L156 160 Z"/>
    <path id="badge-nb-leafRightD" d="M175 147 L162 170 L141 164 Z"/>
    <path id="badge-nb-leafRightE" d="M159 152 L149 173 L128 166 Z"/>
