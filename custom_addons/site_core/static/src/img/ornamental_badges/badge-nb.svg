    <path id="badge-nb-crestInner" d="M111.5 119 L146 131 L141 159 L111.5 171 L82 159 L77 131 Z"/>
    <path id="badge-nb-star" d="M111.5 124 L116 134 L127 135 L118.5 142.5 L121 154 L111.5 148 L102 154 L104.5 142.5 L96 135 L107 134 Z"/>
    <path id="badge-nb-leafLeft1" d="M7 119 L28 141 L17 145 Z"/>
