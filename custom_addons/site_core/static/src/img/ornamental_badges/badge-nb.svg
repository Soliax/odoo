    <path id="badge-nb-leafRight1" d="M216 119 L205 145 L195 141 Z"/>
    <path id="badge-nb-leafRight2" d="M205 132 L192 157 L176 154 Z"/>
    <path id="badge-nb-leafRight3" d="M190 140 L177 165 L156 160 Z"/>
