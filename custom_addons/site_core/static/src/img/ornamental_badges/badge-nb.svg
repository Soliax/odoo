<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 223 260" width="223" height="260" role="img" aria-labelledby="badge-nb-title badge-nb-desc" data-level="NB">
  <title id="badge-nb-title">NB profile ranking badge</title>
  <desc id="badge-nb-desc">Editable RPG-style profile ranking badge with a replaceable real-person portrait slot, dynamic crest rank text, and a lower nameplate for editable name and rank title.</desc>
  <defs>
    <linearGradient id="badge-nb-outerMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#89919a"/>
      <stop offset="0.28" stop-color="#42474f"/>
      <stop offset="0.56" stop-color="#050608"/>
      <stop offset="0.78" stop-color="#42474f"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badge-nb-facetMetal" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.3" stop-color="#dce1e7" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#050608" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="badge-nb-innerPanel" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#10201c"/>
      <stop offset="0.58" stop-color="#1c2228"/>
      <stop offset="1" stop-color="#030506"/>
    </radialGradient>
    <radialGradient id="badge-nb-photoGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#42474f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="badge-nb-glassShine" cx="34%" cy="24%" r="84%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badge-nb-softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="badge-nb-photoClip"><path d="M111.5 19 L179 48 L171 114 L149 137 L128 137 L121 120 L102 120 L95 137 L74 137 L52 114 L44 48 Z"/></clipPath>
