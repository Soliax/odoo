  <g id="badge-nb-glowGroup" filter="url(#badge-nb-softGlow)">
    <use href="#badge-nb-frameOuter" fill="url(#badge-nb-photoGlow)"/>
    <use href="#badge-nb-nameplateOuter" fill="url(#badge-nb-photoGlow)"/>
    <use href="#badge-nb-crestOuter" fill="url(#badge-nb-photoGlow)"/>
  </g>

  <g id="badge-nb-photoAreaGroup">
    <image id="badge-nb-portraitImage" href="" x="40" y="18" width="143" height="122" preserveAspectRatio="xMidYMid slice" clip-path="url(#badge-nb-photoClip)"/>
    <g clip-path="url(#badge-nb-photoClip)">
      <rect x="40" y="18" width="143" height="122" fill="#000000"/>
      <rect x="40" y="18" width="143" height="122" fill="url(#badge-nb-innerPanel)"/>
      <ellipse cx="111.5" cy="74" rx="48" ry="37" fill="#3b4047" fill-opacity="0.14"/>
      <ellipse cx="111.5" cy="95" rx="62" ry="30" fill="#000000" fill-opacity="0.2"/>
      <path d="M50 31 C78 18 117 17 173 36 L173 67 C146 55 113 52 84 57 C69 60 57 65 50 72 Z" fill="url(#badge-nb-glassShine)"/>
    </g>
  </g>

  <g id="badge-nb-frameGroup">
    <path d="M111.5 4 L198 38 L186 124 L161 150 L134 150 L128 131 L95 131 L89 150 L62 150 L37 124 L25 38 Z M111.5 18 L182 47 L173 117 L153 139 L127 139 L121 121 L102 121 L96 139 L70 139 L50 117 L41 47 Z" fill="url(#badge-nb-outerMetal)" fill-rule="evenodd"/>
    <use href="#badge-nb-frameOuter" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
    <use href="#badge-nb-frameInner" fill="none" stroke="#020403" stroke-opacity="0.8" stroke-width="1.2"/>
    <path d="M111.5 8 L191 40 L184 50 L111.5 19 L39 50 L32 40 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M184 50 L191 40 L180 119 L173 117 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M39 50 L32 40 L43 119 L50 117 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M173 117 L181 121 L160 145 L153 139 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M50 117 L42 121 L63 145 L70 139 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M96 139 L89 150 L62 150 L70 139 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M127 139 L134 150 L161 150 L153 139 Z" fill="url(#badge-nb-facetMetal)"/>
  </g>

  <g id="badge-nb-laurelsGroup">
    <g fill="url(#badge-nb-outerMetal)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="0.7">
      <use href="#badge-nb-leafLeftA"/>
      <use href="#badge-nb-leafLeftB"/>
      <use href="#badge-nb-leafLeftC"/>
      <use href="#badge-nb-leafLeftD"/>
      <use href="#badge-nb-leafLeftE"/>
      <use href="#badge-nb-leafRightA"/>
      <use href="#badge-nb-leafRightB"/>
      <use href="#badge-nb-leafRightC"/>
      <use href="#badge-nb-leafRightD"/>
      <use href="#badge-nb-leafRightE"/>
    </g>
    <g fill="url(#badge-nb-facetMetal)">
      <path d="M11 122 L22 140 L17 145 Z"/>
      <path d="M213 122 L206 145 L201 140 Z"/>
      <path d="M37 143 L55 156 L46 165 Z"/>
      <path d="M186 143 L177 165 L168 156 Z"/>
    </g>
  </g>

  <g id="badge-nb-crestGroup">
    <path d="M111.5 110 L154 126 L148 164 L111.5 179 L75 164 L69 126 Z" fill="url(#badge-nb-outerMetal)"/>
    <use href="#badge-nb-crestOuter" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
    <use href="#badge-nb-crestInner" fill="url(#badge-nb-innerPanel)"/>
    <use href="#badge-nb-crestInner" fill="none" stroke="#d8dde2" stroke-opacity="0.35" stroke-width="0.8"/>
    <path d="M86 126 L111.5 118 L137 126 L133 134 L111.5 127 L90 134 Z" fill="url(#badge-nb-facetMetal)"/>
    <use href="#badge-nb-star" fill="url(#badge-nb-outerMetal)"/>
    <use href="#badge-nb-star" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8"/>
    <circle cx="111.5" cy="139" r="2.2" fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <g id="badge-nb-nameplateGroup">
    <path d="M37 170 L186 170 L214 191 L194 228 L29 228 L9 191 Z M45 178 L178 178 L201 194 L186 220 L37 220 L22 194 Z" fill="url(#badge-nb-outerMetal)" fill-rule="evenodd"/>
    <use href="#badge-nb-nameplateOuter" fill="none" stroke="#ffffff" stroke-opacity="0.52" stroke-width="1.1"/>
    <use href="#badge-nb-nameplateInner" fill="url(#badge-nb-innerPanel)"/>
    <use href="#badge-nb-nameplateInner" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
    <path d="M42 174 L181 174 L172 180 L51 180 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M25 194 L40 182 L38 218 L29 228 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M198 182 L202 194 L194 228 L185 218 Z" fill="url(#badge-nb-facetMetal)"/>
    <path d="M111.5 220 L157 220 L150 226 L74 226 L66 220 Z" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <g id="badge-nb-labelGroup">
    <text id="badge-nb-labelShadow" x="111.5" y="203" text-anchor="middle" font-family="'Orbitron', 'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#000000" fill-opacity="0.72" transform="translate(0 1.8)">NB</text>
    <text id="badge-nb-labelText" x="111.5" y="203" text-anchor="middle" font-family="'Orbitron', 'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#f5fffb">NB</text>
  </g>

  <g id="badge-nb-highlightsGroup" pointer-events="none">
    <path d="M111.5 7 L187 38" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M111.5 7 L35 38" stroke="#ffffff" stroke-opacity="0.62" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M31 53 L39 112" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M192 46 L183 113" stroke="#ffffff" stroke-opacity="0.52" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M52 157 L91 169" stroke="#ffffff" stroke-opacity="0.23" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M171 157 L132 169" stroke="#ffffff" stroke-opacity="0.23" stroke-width="0.9" stroke-linecap="round"/>
    <ellipse cx="86" cy="43" rx="22" ry="7" transform="rotate(-28 86 43)" fill="#ffffff" fill-opacity="0.22"/>
    <ellipse cx="140" cy="193" rx="36" ry="5" fill="#ffffff" fill-opacity="0.09"/>
  </g>
